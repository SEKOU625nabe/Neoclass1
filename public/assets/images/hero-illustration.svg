<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9"/>
      <stop offset="100%" style="stop-color:#C8E6C9"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58CC02"/>
      <stop offset="100%" style="stop-color:#46A302"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)" rx="20"/>
  
  <!-- Student Character -->
  <g transform="translate(100, 50)">
    <!-- Body -->
    <rect x="60" y="100" width="80" height="100" fill="#FFB74D" rx="10"/>
    
    <!-- Head -->
    <circle cx="100" cy="70" r="45" fill="#FFB74D"/>
    
    <!-- Eyes -->
    <circle cx="85" cy="65" r="8" fill="white"/>
    <circle cx="115" cy="65" r="8" fill="white"/>
    <circle cx="87" cy="66" r="4" fill="#333"/>
    <circle cx="117" cy="66" r="4" fill="#333"/>
    
    <!-- Smile -->
    <path d="M85 85 Q100 100 115 85" stroke="#333" stroke-width="3" fill="none"/>
    
    <!-- Hair -->
    <path d="M55 55 Q100 20 145 55" fill="#5D4037"/>
    
    <!-- Book -->
    <rect x="30" y="130" width="50" height="40" fill="#58CC02" rx="3"/>
    <rect x="35" y="135" width="40" height="2" fill="white"/>
    <rect x="35" y="142" width="35" height="2" fill="white"/>
    <rect x="35" y="149" width="40" height="2" fill="white"/>
    
    <!-- Graduation Cap -->
    <polygon points="60,30 100,15 140,30 100,45" fill="#333"/>
    <rect x="95" y="15" width="10" height="5" fill="#333"/>
    <circle cx="100" cy="10" r="5" fill="#FFD700"/>
    <line x1="100" y1="10" x2="120" y2="20" stroke="#FFD700" stroke-width="2"/>
    <circle cx="122" cy="22" r="4" fill="#FFD700"/>
  </g>
  
  <!-- XP Stars -->
  <text x="280" y="80" font-size="30">⭐</text>
  <text x="300" y="120" font-size="24">⚡</text>
  <text x="260" y="140" font-size="28">🔥</text>
  
  <!-- Progress Bar -->
  <rect x="220" y="180" width="150" height="20" fill="#E0E0E0" rx="10"/>
  <rect x="220" y="180" width="100" height="20" fill="url(#primary)" rx="10"/>
  
  <!-- Trophy -->
  <text x="310" y="240" font-size="40">🏆</text>
  
  <!-- +XP Badge -->
  <g transform="translate(240, 220)">
    <rect x="0" y="0" width="60" height="25" fill="#58CC02" rx="12"/>
    <text x="30" y="18" text-anchor="middle" font-size="14" fill="white" font-weight="bold">+50 XP</text>
  </g>
</svg>
