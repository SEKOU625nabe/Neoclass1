<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#6c63ff" />
  <meta name="format-detection" content="telephone=no" />
  <title>Neoclass - Apprends, Gagne, Évolue</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
  
  <!-- Manifest -->
  <link rel="manifest" href="manifest.json" />
  
  <!-- Embedded Styles -->
  <style>
    :root {
      --bg: #f5f7fa;
      --bg-card: #ffffff;
      --bg-hover: #f0f0f5;
      --text: #1a1a2e;
      --text-secondary: #6b7280;
      --primary: #6c63ff;
      --primary-light: #8b83ff;
      --primary-dark: #5a52d5;
      --accent: #f59e0b;
      --accent-light: #fbbf24;
      --success: #10b981;
      --danger: #ef4444;
      --info: #3b82f6;
      --border: #e5e7eb;
      --shadow: 0 4px 24px rgba(0,0,0,0.06);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.1);
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
      --font: 'Inter', sans-serif;
      --gold: #fbbf24;
    }

    [data-theme="dark"] {
      --bg: #0a0a12;
      --bg-card: #12121f;
      --bg-hover: #1a1a2e;
      --text: #ffffff;
      --text-secondary: #b8b8c8;
      --border: #2a2a40;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.5);
      --primary: #fbbf24;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    @supports (padding: max(0px)) {
      body {
        padding-left: max(0px, env(safe-area-inset-left));
        padding-right: max(0px, env(safe-area-inset-right));
        padding-top: max(0px, env(safe-area-inset-top));
        padding-bottom: max(0px, env(safe-area-inset-bottom));
      }
    }

    .mobile-app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    /* CINEMATIC OPENING */
    #cinematicOpening {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #cinematicOpening.hidden {
      display: none !important;
    }

    .cinematic-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #0f0c29);
      background-size: 400% 400%;
      animation: gradientFlow 15s ease infinite;
    }

    .cinematic-overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.4) 100%);
    }

    .cinematic-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    .cinematic-logo {
      font-size: 4rem;
      margin-bottom: 20px;
      animation: logoReveal 1.5s ease forwards;
    }

    .cinematic-title {
      font-size: 3rem;
      font-weight: 900;
      background: linear-gradient(135deg, #fff, #a78bfa, #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: textGlow 3s ease-in-out infinite;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .cinematic-subtitle {
      font-size: 1rem;
      color: rgba(255,255,255,0.8);
      animation: subtitleSlide 1.5s ease forwards 0.5s;
      opacity: 0;
      margin-bottom: 30px;
    }

    .cinematic-tagline {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.9);
      animation: subtitleSlide 1.5s ease forwards 1s;
      opacity: 0;
      margin-bottom: 40px;
    }

    .cinematic-progress {
      width: 160px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    .cinematic-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #8b5cf6, #6366f1, #a78bfa);
      border-radius: 10px;
      animation: progressGlow 3s ease forwards;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes logoReveal {
      0% { opacity: 0; transform: scale(0.3) rotateY(180deg); }
      60% { opacity: 1; }
      100% { transform: scale(1) rotateY(0); }
    }

    @keyframes textGlow {
      0%, 100% { text-shadow: 0 0 20px rgba(255,255,255,0.3); }
      50% { text-shadow: 0 0 40px rgba(255,255,255,0.8); }
    }

    @keyframes subtitleSlide {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes progressGlow {
      0% { width: 0; }
      100% { width: 100%; }
    }

    /* AUTH PAGE */
    #authPage {
      display: flex;
      flex: 1;
      overflow-y: auto;
      animation: fadeIn 0.5s ease;
    }

    #authPage:not(.active) {
      display: none;
    }

    /* DASHBOARD PAGE */
    #dashboardPage {
      display: flex;
      flex: 1;
      overflow-y: auto;
      animation: fadeIn 0.5s ease;
    }

    #dashboardPage:not(.active) {
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* CONTAINER */
    .container {
      max-width: 100%;
      margin: 0 auto;
      padding: 0 15px;
    }

    /* CARD */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 15px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 15px;
    }

    /* BUTTON */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      font-size: 0.95rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
    }

    .btn-secondary {
      background: var(--bg-hover);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    /* FORM */
    .form-group {
      margin-bottom: 15px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .form-input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.1);
    }

    /* UTILITIES */
    .text-center { text-align: center; }
    .mb-2 { margin-bottom: 15px; }
    .mb-3 { margin-bottom: 20px; }

    /* LOADER */
    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(108, 99, 255, 0.2);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 40px 20px;
    }

    /* TOAST */
    .toast-container {
      position: fixed;
      top: 60px;
      right: 15px;
      left: 15px;
      z-index: 2000;
    }

    .toast {
      background: var(--bg-card);
      color: var(--text);
      padding: 15px 20px;
      border-radius: 10px;
      border-left: 4px solid var(--primary);
      margin-bottom: 10px;
      box-shadow: var(--shadow-lg);
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { transform: translateX(400px); }
      to { transform: translateX(0); }
    }

    /* NAVBAR */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar h1 {
      font-size: 1.2rem;
      font-weight: 800;
    }

    /* DASHBOARD CONTAINER */
    .dashboard-container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="mobile-app">
    <!-- CINEMATIC OPENING -->
    <div id="cinematicOpening">
      <div class="cinematic-bg"></div>
      <div class="cinematic-overlay"></div>
      <div class="cinematic-content">
        <div class="cinematic-logo">🎓</div>
        <h1 class="cinematic-title">Neo<span style="color: #fbbf24;">class</span></h1>
        <p class="cinematic-subtitle">L'excellence à portée de main</p>
        <p class="cinematic-tagline">✨ Apprends. Gagne. Évolue. ✨</p>
        <div class="cinematic-progress">
          <div class="cinematic-progress-bar"></div>
        </div>
      </div>
    </div>

    <!-- AUTH PAGE -->
    <div id="authPage" class="active">
      <div class="container">
        <div style="padding: 40px 0;">
          <div class="card text-center">
            <div style="font-size: 3rem; margin-bottom: 15px;">🔐</div>
            <h1 style="font-size: 1.8rem; margin-bottom: 10px;">Bienvenue</h1>
            <p style="color: var(--text-secondary); margin-bottom: 30px;">Apprends, Gagne, Évolue</p>
            <div id="authContent"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- DASHBOARD PAGE -->
    <div id="dashboardPage">
      <div id="dashboardContent"></div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toastContainer" class="toast-container"></div>
  </div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js"></script>

  <!-- App Scripts -->
  <script src="data.js"></script>
  <script src="firebase-service.js"></script>
  <script src="modules/auth.js"></script>
  <script src="modules/dashboard.js"></script>
  <script src="modules/courses.js"></script>
  <script src="modules/finance.js"></script>
  <script src="modules/social.js"></script>
  <script src="modules/admin.js"></script>
  <script src="modules/mistral-ai.js"></script>
  <script src="modules/ai-chat.js"></script>
  <script src="app.js"></script>
  <script src="app-utils.js"></script>
</body>
</html>
